# Su Kalitesi Sınıflandırma — Docker Compose (temel / teslim)
#
#   docker compose up --build          → her makinede çalışır (CPU, GPU gerekmez)
#
# Ek dosyalar:
#   docker-compose.gpu.yml  → PyTorch CUDA wheel'i + NVIDIA GPU rezervasyonu
#   docker-compose.dev.yml  → kod bind mount'ları, otomatik yeniden yükleme,
#                             veritabanı ve modeller host klasörlerinde
#   Birleştirme: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#   (ya da .env içinde COMPOSE_FILE — bkz. .env.example)
#
# Kalıcı veri:
#   ./data           → CSV veri seti (salt okunur, repoda)
#   su_kalitesi_db   → SQLite veritabanı (named volume)
#   su_kalitesi_garage → eğitilmiş modeller (named volume)
#   Named volume'lar her ortamda (Linux, WSL2, Docker Desktop) izin sorunu
#   olmadan çalışır; içerik `docker compose down` ile silinmez
#   (`down -v` siler).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_INDEX: cpu
    image: su-kalitesi-backend:cpu
    container_name: su_kalitesi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - su_kalitesi_db:/app/database
      - su_kalitesi_garage:/app/backend/garage
    environment:
      - TZ=Europe/Istanbul
    networks:
      - bitirme-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: su-kalitesi-frontend:latest
    container_name: su_kalitesi_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # EDA / Preprocessing sekmeleri CSV'yi doğrudan okur
      - ./data:/app/data:ro
    environment:
      - TZ=Europe/Istanbul
      # api_client.py bu adresle backend servisine bağlanır
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bitirme-net

volumes:
  su_kalitesi_db:
  su_kalitesi_garage:

networks:
  bitirme-net:
    driver: bridge
    name: bitirme-net
