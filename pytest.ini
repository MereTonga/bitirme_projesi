[pytest]
testpaths = tests
pythonpath = backend
# Entegrasyon testleri canlı sistem ister; varsayılan çalıştırmada atlanır.
#   pytest                  → birim + API testleri (geçici garaj/DB)
#   pytest -m integration   → docker compose ile ayakta olan sisteme karşı
addopts = -q -m "not integration"
markers =
    integration: canlı backend/frontend gerektiren uçtan uca testler
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    # LightGBM 4.6 + sklearn 1.8 yanlış alarmı (ayrıntı: backend/config.py)
    ignore:X does not have valid feature names, but LGBMClassifier:UserWarning
